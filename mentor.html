<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor · One-to-One Guidance | VKS Tech</title>
  <link rel="icon" href="logo.jpeg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #0f172a; }
    .bar {
      height: 52px; display: flex; align-items: center; gap: 12px;
      padding: 0 14px; background: #0f172a; color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .bar a {
      color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 600;
      padding: 8px 10px; border-radius: 10px; transition: .15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .bar a:hover { background: rgba(255,255,255,.08); color: #fff; }
    .bar .brand-home { font-weight: 800; font-size: 15px; color: #fff; }
    .bar .brand-home .tech { color: #f87171; font-weight: 500; }
    .bar .brand { font-weight: 700; font-size: 14px; color: #e2e8f0; margin-right: auto; }
    .bar .brand span { color: #94a3b8; font-weight: 500; }
    .bar img.logo { height: 28px; width: 28px; border-radius: 50%; object-fit: cover; }
    iframe { width: 100%; height: calc(100% - 52px); border: 0; display: block; background: #fff; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="index.html" class="brand-home">
      <img class="logo" src="logo.jpeg" alt="VKS Tech" />
      <span>VKS<span class="tech">Tech</span></span>
    </a>
    <div class="brand">Mentor <span>· One-to-One Guidance</span></div>
    <a href="resume.html">Resume Builder</a>
  </div>
  <iframe src="Mentor/mentor.html" title="Mentor · One-to-One Guidance" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
</body>
</html>
